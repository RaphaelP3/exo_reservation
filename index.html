<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atelier Nova — Réservations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <p class="eyebrow">ATELIER NOVA</p>
        <h1>Gestion des réservations</h1>
        <p>Suivi des demandes de rendez-vous</p><span id="reservation-count">0 réservation</span>
    </header>
    <main>
        <section class="panel">
            <h2>Nouvelle réservation</h2>
            <h3>Réservation</h3>
            <form id="reservation-form"><label for="customer">Nom du client</label><input id="customer" name="customer"
                    required placeholder="Camille Martin"><label for="service">Prestation</label><select id="service"
                    name="service">
                    <option>Diagnostic</option>
                    <option>Atelier découverte</option>
                    <option>Conseil</option>
                </select><label for="date">Date souhaitée</label><input id="date" name="date" type="date"
                    required><button>Ajouter</button>
                <p id="form-message" aria-live="polite"></p>
            </form>
        </section>
        <section class="panel">
            <h2>Réservations</h2><input id="search" type="search" placeholder="Rechercher un client">
            <ul id="reservation-list"></ul>
            <p id="empty-state">Aucune réservation pqour le moment.</p>
        </section>
    </main>
    <footer>Projet pédagogique — Git avancé</footer>
    <script src="app.js"></script>
</body>

</html>
